<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Smart Display</title>
<style>
:root{--a:#8ab4ff;--g:rgba(255,255,255,.16);--gb:rgba(255,255,255,.28);--t:#fff;--s1:#a9c4e4;--s2:#f1d9bd;--m1:#6f6455;--m2:#a39583;--d1:#d9c6a8;--d2:#c2ac8c}
[data-th=night]{--s1:#1a2650;--s2:#b58aa6;--m1:#2f2a3d;--m2:#4c4160;--d1:#5b4a66;--d2:#3d3049}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#000;color:var(--t);font-family:"SF Pro Display",Roboto,system-ui,sans-serif;touch-action:none}
#bg{position:fixed;inset:0;background:linear-gradient(var(--s1),var(--s2) 62%);background-size:cover;background-position:center;transition:background 1s}
svg.sc{position:absolute;inset:0;width:100%;height:100%}
.m1{fill:var(--m1)}.m2{fill:var(--m2)}.d1{fill:var(--d1)}.d2{fill:var(--d2)}
.custom svg.sc{display:none}
.page{position:fixed;inset:0;will-change:transform,opacity,filter}
.glass{background:var(--g);backdrop-filter:blur(25px) saturate(160%);-webkit-backdrop-filter:blur(25px) saturate(160%);border:1px solid var(--gb);border-radius:28px;box-shadow:0 8px 32px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.3)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* lock */
#date{position:absolute;top:6.5vh;width:100%;text-align:center;font-size:2.4vh;font-weight:600;text-transform:capitalize;text-shadow:0 1px 8px rgba(0,0,0,.2)}
#clock{position:absolute;top:11vh;width:100%;text-align:center;white-space:nowrap;font-size:min(30vh,22vw);line-height:1;font-weight:500;font-stretch:condensed;font-family:"Roboto Condensed","Arial Narrow","SF Pro Display",sans-serif;letter-spacing:-.01em;background:linear-gradient(#fff 20%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(0,0,0,.15))}
#ridge{z-index:2;pointer-events:none}
#chip{position:absolute;top:4vh;right:3vw;z-index:3;padding:1vh 2vh;font-size:2vh;border-radius:99px}
#wx{position:absolute;left:4vw;bottom:9vh;z-index:3;padding:2.4vh 3vh;min-width:24vw}
#wx b{font-size:5vh;font-weight:500}#wx small{display:block;opacity:.85;font-size:1.9vh;margin-top:.4vh}
/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;display:flex;justify-content:center;padding-bottom:1.6vh}
#dock i{width:18vh;height:.6vh;border-radius:9px;background:#fff;opacity:.9;box-shadow:0 1px 6px rgba(0,0,0,.25)}
/* pages */
.pad{position:absolute;inset:5vh 4vw 8vh;display:flex;gap:2.5vw}
.pad>.glass{padding:3vh;overflow:auto;touch-action:pan-y}
h2{font-size:3.2vh;margin-bottom:2vh;font-weight:600;text-transform:capitalize}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.8vh;text-align:center}
#grid b{opacity:.6;font-size:1.8vh}
#grid button{aspect-ratio:1.25;border-radius:14px;font-size:2.3vh;position:relative}
#grid .today{border:1px solid var(--a)}#grid .sel{background:var(--a);color:#111;font-weight:700}
#grid .has::after{content:"";position:absolute;bottom:.7vh;left:50%;width:.8vh;height:.8vh;margin-left:-.4vh;border-radius:50%;background:currentColor}
.nav{display:flex;gap:1vh}.nav button{width:5vh;height:5vh;border-radius:50%;background:var(--g);font-size:2.4vh}
.item{display:flex;justify-content:space-between;align-items:center;padding:1.4vh 2vh;margin-bottom:1vh;border-radius:18px;background:rgba(255,255,255,.14);font-size:2.2vh}
.item small{opacity:.7;display:block;font-size:1.7vh}
input,select{font:inherit;font-size:2.1vh;color:#fff;background:rgba(255,255,255,.14);border:1px solid var(--gb);border-radius:14px;padding:1.2vh 1.6vh;outline:0;width:100%}
select option{color:#000}::placeholder{color:rgba(255,255,255,.6)}
.btn{background:var(--a);color:#111;font-weight:600;border-radius:14px;padding:1.2vh 2.4vh;font-size:2.1vh}
#wx,#chip{cursor:pointer}
#det{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(0,0,0,0);transition:background .45s}#det.show{display:grid}#det.bk{background:rgba(0,0,0,.45)}
#dp,.gc{position:relative;width:min(900px,94vw);height:90vh;overflow:auto;border-radius:36px;padding:4vh 3.4vw 3vh;border:1px solid rgba(255,255,255,.25);box-shadow:0 30px 80px rgba(0,0,0,.5);touch-action:pan-y;scrollbar-width:none;will-change:transform,opacity}
#dp::-webkit-scrollbar,.gc::-webkit-scrollbar{display:none}
#dp .x,.gc .x{position:absolute;top:2vh;right:2.4vh;font-size:2.4vh;width:4.6vh;height:4.6vh;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(20px)}
.hero{text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.18)}.hero h2{font-size:4vh;font-weight:500;margin:0;text-transform:none}
.bt{font-size:15vh;font-weight:200;line-height:1.05;padding-left:2.4vh}.hero div{font-size:2.5vh}
.cd{background:rgba(255,255,255,.16);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.22);border-radius:24px;padding:2vh 2.2vh;margin-top:1.6vh}
.cd h4{font-size:1.6vh;font-weight:600;opacity:.7;letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.2vh}
.hrs{display:flex;gap:.6vh;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}.hrs>div{flex:0 0 9vh;text-align:center;display:flex;flex-direction:column;gap:.7vh;font-size:2.3vh}.hrs small{font-size:1.7vh;opacity:.8}.hrs span{font-size:3vh}
.dr{display:grid;grid-template-columns:13vh 6vh 5vh 1fr 5vh;align-items:center;padding:1.1vh 0;border-top:1px solid rgba(255,255,255,.2);font-size:2.3vh}.dr:first-of-type{border:0}
.dr span:first-child{text-transform:capitalize;font-weight:500}.dr small{opacity:.8;font-size:1.5vh;display:block}.dr span:nth-child(3){opacity:.65;text-align:right}.dr span:last-child{text-align:right}
.tr{height:.8vh;border-radius:9px;background:rgba(255,255,255,.25);position:relative;margin:0 1.6vh}.tr i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#6fd3ff,#ffd86b,#ff9a4d)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vh;margin-top:1.6vh}.tl .cd{margin:0}.tl .v{font-size:4.4vh;font-weight:400;margin-bottom:.6vh}.tl small{font-size:1.8vh;opacity:.85;display:block;line-height:1.3}
#gn{position:fixed;inset:0;z-index:55;pointer-events:none}.gs{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;will-change:transform}
#gn .cd{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.2)}
.pad>#ga{padding:2.4vh 3vw;overflow:hidden;display:flex;flex-direction:column}
#gh{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;font-weight:600}
.gg{background:linear-gradient(90deg,#4f8cff,#a07bff,#ff7a9c);-webkit-background-clip:text;background-clip:text;color:transparent}
#nw{font-size:1.9vh;padding:.8vh 1.8vh;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid var(--gb)}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1.2vh;padding:1.4vh .4vw;touch-action:pan-y;scrollbar-width:none}
#hello{margin:auto;display:flex;flex-direction:column;align-items:center;gap:2.6vh}.gt{font-size:5.2vh;font-weight:500;text-align:center}
#chips{display:flex;flex-wrap:wrap;gap:1.2vh;justify-content:center;max-width:70vw}#chips button{padding:1.2vh 2.2vh;border-radius:99px;font-size:2vh;background:rgba(255,255,255,.16);border:1px solid var(--gb);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.msg{max-width:74%;padding:1.3vh 2.2vh;border-radius:24px;font-size:2.2vh;line-height:1.4;user-select:text}
.msg.u{align-self:flex-end;background:var(--a);color:#111;border-bottom-right-radius:8px;white-space:pre-wrap}.msg.m{align-self:flex-start;background:rgba(255,255,255,.2);border-bottom-left-radius:8px}
.msg code{background:rgba(0,0,0,.25);padding:0 .6vh;border-radius:6px}
.dots i{display:inline-block;width:1vh;height:1vh;margin:0 .35vh;border-radius:50%;background:#fff;animation:db 1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes db{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-.6vh)}}
#gi{display:flex;align-items:center;gap:1vh;margin-top:1.2vh;padding:.8vh .8vh .8vh 2.4vh;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid var(--gb)}
#gi input{background:none;border:0;padding:1vh 0;flex:1;border-radius:0}
#gi button{width:5.6vh;height:5.6vh;border-radius:50%;font-size:2.6vh;display:grid;place-items:center}#send{background:var(--a);color:#111;font-weight:700}#mic.rec{background:#ff4d4d}
/* settings & overlays */
#set{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;place-items:center}
#set.show{display:grid}#set .glass{width:min(620px,90vw);max-height:88vh;overflow:auto;padding:3vh;display:grid;gap:1.4vh;background:rgba(40,40,50,.55);touch-action:pan-y}
label{font-size:1.8vh;opacity:.8}
.sw{display:flex;gap:1.4vh}.sw button{width:5vh;height:5vh;border-radius:50%;border:2px solid #fff6}
</style></head>
<body>
<div id="bg">
<svg class="sc" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice"><g id="rg" transform="translate(0,120)"><path class="m2" d="M0 520L120 450 220 500 360 400 520 490 700 380 900 480 1100 370 1300 470 1450 420 1600 480V1000H0Z"/><path class="m1" d="M0 620L180 530 330 600 520 480 760 600 980 510 1200 610 1400 540 1600 610V1000H0Z"/></g><path class="d1" transform="translate(0,60)" d="M0 760Q400 680 800 740T1600 720V1000H0Z"/><path class="d2" transform="translate(0,60)" d="M0 880Q500 800 1000 860T1600 830V1000H0Z"/></svg></div>

<section class="page" id="p0">
<div id="date"></div><div id="clock"></div>
<div id="chip" class="glass">📶 <span id="chipT">--°</span></div>
<svg id="ridge" class="sc" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice"><use href="#rg"/></svg>
<div id="wx" class="glass"><b id="wT">--°</b><small id="wD">Caricamento meteo…</small><small id="wN"></small></div>
</section>

<section class="page" id="p1"><div class="pad">
<div class="glass" style="flex:1.3"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6vh"><h2 id="mt" style="margin:0"></h2><div class="nav"><button id="pv">‹</button><button id="nx">›</button></div></div><div id="grid"></div></div>
<div class="glass" style="flex:1;display:flex;flex-direction:column"><h2 id="dt"></h2><div id="evs" style="flex:1;overflow:auto"></div>
<div style="display:grid;grid-template-columns:1fr 14vh;gap:1vh;margin-top:1vh"><input id="et" placeholder="Nuovo evento"><input id="eh" type="time"></div><button class="btn" id="ea" style="margin-top:1vh">Aggiungi</button></div></div></section>

<section class="page" id="p2"><div class="pad"><div class="glass" style="flex:1"><div style="display:flex;justify-content:space-between"><h2>Notifiche</h2><button class="btn" id="nc">Pulisci</button></div><div id="nl"></div></div></div></section>

<section class="page" id="p3"><div class="pad"><div class="glass" id="ga">
<div id="gh"><span><span class="gg">✦</span> <span class="gg">Assistente AI</span></span><button id="nw">Nuova chat</button></div>
<div id="chat"><div id="hello"><div class="gt gg">Ciao, come posso aiutarti?</div><div id="chips"></div></div></div>
<div id="gi"><input id="q" placeholder="Chiedi qualcosa all'AI..." autocomplete="off"><button id="mic">🎙️</button><button id="send">↑</button></div></div></div></section>

<nav id="dock"><i></i></nav>

<div id="set"><div class="glass">
<h2>Impostazioni</h2>
<label>Chiave API Groq (resta solo su questo dispositivo)</label><input id="sk" type="password" placeholder="gsk_…">
<label>Modello Groq</label><input id="sm" placeholder="llama-3.3-70b-versatile">
<label>Posizione meteo (vuoto = automatica via GPS)</label><input id="sc" placeholder="Automatica · oppure scrivi una città">
<label>Sfondo</label><select id="sb"><option value="auto">Automatico (giorno/notte)</option><option value="day">Deserto giorno</option><option value="night">Deserto notte</option><option value="custom">Immagine personale…</option></select>
<input type="file" id="sf" accept="image/*" style="display:none">
<label>Colore d'accento</label><div class="sw" id="sw"></div>
<button class="btn" id="st" style="background:rgba(255,255,255,.22);color:#fff">Testa la chiave</button><div id="sr" style="font-size:1.9vh;min-height:2.4vh"></div><button class="btn" id="ss">Salva e chiudi</button></div></div>
<div id="det"><div id="dp"><button class="x">✕</button><div id="detc"></div></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Memoria piena')}};

/* Rimosso completamente il vecchio riferimento al salvataggio 'S' di Gemini */
localStorage.removeItem('S');

const S=Object.assign({
 key:'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',
 model:'llama-3.3-70b-versatile',
 city:'',
 bg:'auto',
 acc:'#8ab4ff'
}, L('S_GROQ', {}));

if(!S.key || S.key.startsWith('AIza')) S.key = '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';
if(!S.model || S.model.includes('gemini')) S.model = 'llama-3.3-70b-versatile';

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let E=L('ev',{}),cur=new Date(),sel=iso(new Date()),WX=L('wx',null),NC=L('nc',[]);

/* ---------- tema ---------- */
function theme(){const h=new Date().getHours(),n=S.bg==='night'||(S.bg==='auto'&&(h<6||h>=19));
 document.documentElement.dataset.th=n?'night':'day';document.documentElement.style.setProperty('--a',S.acc);
 const img=L('bgimg',null),c=S.bg==='custom'&&img;document.body.classList.toggle('custom',!!c);
 $('#bg').style.backgroundImage=c?`url(${img})`:'';}
/* ---------- orologio ---------- */
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('it-IT',{hour:'numeric',minute:'2-digit'});
 $('#date').textContent=d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})} setInterval(()=>{tick();if(!(new Date().getSeconds()))theme()},1000); /* ---------- pager circolare con molla, swipe ovunque ---------- */ const P=$$('.page'),N=P.length,SL=[0,3,2,1],wrap=d=>((d+N/2)%N+N)%N-N/2,mod=x=>((x%N)+N)%N;
let pos=0,vel=0,tg=0,raf,last,drag,swiped=false,lp;
function render(){P.forEach((p,i)=>{const d=wrap(SL[i]-pos),a=Math.min(Math.abs(d),1);
 p.style.transform=`translateX(${d*100}%) scale(${1-.1*a})`;p.style.opacity=1-.7*a;p.style.filter=`blur(${a*10}px)`;p.style.pointerEvents=a<.5?'auto':'none';p.style.visibility=a>=1?'hidden':'visible'})}
function step(t){const dt=Math.min((t-last)/1000,.032);last=t;vel+=(-170*(pos-tg)-22*vel)*dt;pos+=vel*dt;render();
 if(Math.abs(pos-tg)>.0004||Math.abs(vel)>.002)raf=requestAnimationFrame(step);else{pos=tg=mod(tg);vel=0;render()}}
function go(i){tg=i;cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(step);if(mod(tg)===2)notif()}
document.addEventListener('pointerdown',e=>{if(e.target.closest('input,select,#set,#det'))return;cancelAnimationFrame(raf);
 drag={x:e.clientX,y:e.clientY,p:pos,lx:e.clientX,lt:performance.now(),v:0,m:false}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.m){if(Math.abs(dx)<12&&Math.abs(dy)<12)return;if(Math.abs(dy)>Math.abs(dx)){drag=null;go(tg);return}drag.m=true;clearTimeout(lp);try{document.body.setPointerCapture(e.pointerId)}catch{}}
 pos=drag.p-dx/innerWidth*1.2;const n=performance.now();drag.v=-(e.clientX-drag.lx)/innerWidth*1.2/((n-drag.lt)/1000||1);drag.lx=e.clientX;drag.lt=n;render()});
function end(){clearTimeout(lp);if(!drag)return;const d=drag;drag=null;
 if(d.m){swiped=true;setTimeout(()=>swiped=false,60);vel=d.v;go(Math.round(pos+Math.max(-1.2,Math.min(1.2,d.v*.25))))}else go(tg)}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',()=>{clearTimeout(lp);if(drag){drag=null;go(Math.round(pos))}});
document.addEventListener('click',e=>{if(swiped){e.stopPropagation();e.preventDefault()}},true);
$('#clock').addEventListener('pointerdown',()=>{lp=setTimeout(openSet,800)});
/* ---------- meteo ---------- */
const WC=c=>c==0?['☀️','Sereno']:c<3?['⛅','Poco nuvoloso']:c==3?['☁️','Coperto']:c<50?['🌫️','Nebbia']:c<70?['🌧️','Pioggia']:c<80?['❄️','Neve']:c<95?['🌦️','Rovesci']:['⛈️','Temporale'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gps=()=>new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lon:p.coords.longitude}),()=>r(null),{timeout:10000,maximumAge:600000})});
async function weather(){try{let la,lo,name;
 if(S.city){const g=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(S.city)}&count=1&language=it`)).json();const r=g.results[0];la=r.latitude;lo=r.longitude;name=r.name}
 else{const p=await gps()||L('geo',null);if(!p)throw 0;la=p.lat;lo=p.lon;W('geo',p);
  try{const g=await(await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=it`)).json();name=g.city||g.locality||g.principalSubdivision}catch{}name=name||'La tua posizione'}
 const w=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m,pressure_msl&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=4`)).json();
 const H=w.hourly,D=w.daily,c=w.current,hi=Math.max(0,H.time.findIndex(t=>t>=c.time.slice(0,13)+':00'));
 WX={city:name,t:Math.round(c.temperature_2m),f:Math.round(c.apparent_temperature),c:c.weather_code,hum:c.relative_humidity_2m,wind:Math.round(c.wind_speed_10m),press:Math.round(c.pressure_msl),
  max:Math.round(D.temperature_2m_max[0]),min:Math.round(D.temperature_2m_min[0]),rain:D.precipitation_probability_max[0],rain1:D.precipitation_probability_max[1],sum:D.precipitation_sum[0],uv:D.uv_index_max[0],sr:D.sunrise[0].slice(11),ss:D.sunset[0].slice(11),
  hours:H.time.slice(hi,hi+24).map((t,i)=>({h:t.slice(11,13),t:Math.round(H.temperature_2m[hi+i]),c:H.weather_code[hi+i],p:H.precipitation_probability[hi+i]})),
  days:D.time.map((t,i)=>({d:t,c:D.weather_code[i],max:Math.round(D.temperature_2m_max[i]),min:Math.round(D.temperature_2m_min[i]),p:D.precipitation_probability_max[i]})),at:Date.now()};
 W('wx',WX)}catch(e){}showWx()}
function showWx(){if(!WX)return;const[i,t]=WC(WX.c);$('#wT').textContent=`${i} ${WX.t}°`;$('#chipT').textContent=WX.t+'°';
 $('#wD').textContent=`${WX.city} · ${t} · percepita ${WX.f}°`;lockNext()}
function bgFor(c){const n=document.documentElement.dataset.th==='night';
 if(c>=95)return n?'linear-gradient(#1b1d27,#3a3f52)':'linear-gradient(#444b5e,#6b7388)';
 if(c>=71&&c<=77)return n?'linear-gradient(#26324a,#5a6b8c)':'linear-gradient(#7d95b5,#c4d2e4)';
 if(c>=51)return n?'linear-gradient(#1f2633,#404d61)':'linear-gradient(#52637a,#8497ad)';
 if(c>=45)return n?'linear-gradient(#2a3040,#555e70)':'linear-gradient(#7a8798,#aab4c2)';
 return n?'linear-gradient(#0d1633,#2b3c78)':'linear-gradient(#2f72d4,#74b8fb)'}
function detail(){const[i,t]=WC(WX.c),uv=WX.uv,ul=uv<3?'Basso':uv<6?'Moderato':uv<8?'Alto':uv<11?'Molto alto':'Estremo';
