<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Smart Display</title>
<style>
:root{--a:#8ab4ff;--g:rgba(255,255,255,.16);--gb:rgba(255,255,255,.28);--s1:#a9c4e4;--s2:#f1d9bd;--m1:#6f6455;--m2:#a39583;--d1:#d9c6a8;--d2:#c2ac8c}
[data-th=night]{--s1:#1a2650;--s2:#b58aa6;--m1:#2f2a3d;--m2:#4c4160;--d1:#5b4a66;--d2:#3d3049}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:"SF Pro Rounded","SF Pro Display",Roboto,system-ui,sans-serif;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#bg{position:fixed;inset:0;background:linear-gradient(var(--s1),var(--s2) 62%);background-size:cover;background-position:center;transition:background 1s}
#bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
svg.sc{position:absolute;inset:0;width:100%;height:100%}.m1{fill:var(--m1)}.m2{fill:var(--m2)}.d1{fill:var(--d1)}.d2{fill:var(--d2)}.custom svg.sc{display:none}
.page{position:fixed;inset:0;will-change:transform,opacity,filter;overflow:hidden}
.glass,.tile{background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.1));backdrop-filter:blur(25px) saturate(170%);-webkit-backdrop-filter:blur(25px) saturate(170%);border:1px solid var(--gb);border-radius:30px;box-shadow:0 10px 34px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4)}
/* home */
#home{position:absolute;inset:4vh 3vw 6vh;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:2vh}
.tile{padding:2.4vh;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s cubic-bezier(.2,.9,.3,1.2);text-shadow:0 1px 8px rgba(0,0,0,.18)}
.tile:active{transform:scale(.965)}
#tw{grid-area:1/1/3/3}#tc{grid-area:1/3;padding:1.4vh}#td{grid-area:1/4}#te{grid-area:2/3/3/5}#ts{grid-area:3/1/4/3;flex-direction:row;align-items:center;gap:2vh}#ta{grid-area:3/3}#tn{grid-area:3/4}
.lab{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.3vh;font-size:2vh}.lab b{font-size:2.4vh;font-weight:600}.lab span,.sub{opacity:.8}
#tw .wt{display:flex;gap:1.2vh;align-items:center;font-size:2.6vh;justify-content:center}#wic{font-size:5vh}
#wnum{font-size:25vh;font-weight:600;line-height:1;text-align:center;letter-spacing:-.02em}
#ck{width:100%;height:100%}
#td{align-items:center;justify-content:center;text-align:center;gap:.4vh}#dwk{font-size:2.2vh;text-transform:capitalize;font-weight:600;color:#ffb4b4}#dnum{font-size:11vh;font-weight:500;line-height:1}#dmo{font-size:2vh;text-transform:capitalize;opacity:.85}
#te h4{font-size:1.8vh;letter-spacing:.07em;text-transform:uppercase;opacity:.75;margin-bottom:1vh}#evl{flex:1;overflow:hidden}
.er{display:flex;gap:1.6vh;padding:1.1vh 0;border-top:1px solid rgba(255,255,255,.2);font-size:2.2vh}.er:first-child{border:0}.er b{color:var(--a);min-width:11vh;font-weight:600}
.ic{font-size:6vh;text-align:center;position:relative}#nb{position:absolute;top:0;margin-left:-.4vh;width:1.6vh;height:1.6vh;border-radius:50%;background:#ff453a;display:none}
.mv{height:100%;aspect-ratio:1;flex:none}.mi{display:flex;flex-direction:column;min-width:0;flex:1;gap:.5vh}.mi b{font-size:2.8vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi span{opacity:.8;font-size:2.1vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc{width:7vh;height:7vh;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
svg.i{width:3.4vh;height:3.4vh;fill:#fff}
.gg{background:linear-gradient(90deg,#4f8cff,#a07bff,#ff7a9c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;display:flex;justify-content:center;padding-bottom:1.6vh}
#dock i{width:18vh;height:.6vh;border-radius:9px;background:#fff;opacity:.9;box-shadow:0 1px 6px rgba(0,0,0,.25)}
/* pagine */
.pad{position:absolute;inset:5vh 4vw 7vh;display:flex;gap:2.5vw}.pad>.glass{padding:3vh;overflow:auto;touch-action:pan-y}
h2{font-size:3.2vh;margin-bottom:2vh;font-weight:600;text-transform:capitalize}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.8vh;text-align:center}#grid b{opacity:.6;font-size:1.8vh}
#grid button{aspect-ratio:1.25;border-radius:14px;font-size:2.3vh;position:relative}#grid .today{border:1px solid var(--a)}#grid .sel{background:var(--a);color:#111;font-weight:700}
#grid .has::after{content:"";position:absolute;bottom:.7vh;left:50%;width:.8vh;height:.8vh;margin-left:-.4vh;border-radius:50%;background:currentColor}
.nav{display:flex;gap:1vh}.nav button{width:5vh;height:5vh;border-radius:50%;background:var(--g);font-size:2.4vh}
.item{display:flex;justify-content:space-between;align-items:center;padding:1.4vh 2vh;margin-bottom:1vh;border-radius:18px;background:rgba(255,255,255,.14);font-size:2.2vh}.item small{opacity:.7;display:block;font-size:1.7vh}
input,select{font:inherit;font-size:2.1vh;color:#fff;background:rgba(255,255,255,.14);border:1px solid var(--gb);border-radius:14px;padding:1.2vh 1.6vh;outline:0;width:100%}select option{color:#000}::placeholder{color:rgba(255,255,255,.6)}
.btn{background:var(--a);color:#111;font-weight:600;border-radius:14px;padding:1.2vh 2.4vh;font-size:2.1vh}.btn.alt{background:rgba(255,255,255,.22);color:#fff}
/* assistente */
.pad>#ga{padding:2.4vh 3vw;overflow:hidden;display:flex;flex-direction:column}
#gh{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;font-weight:600}
#nw{font-size:1.9vh;padding:.8vh 1.8vh;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid var(--gb)}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1.2vh;padding:1.4vh .4vw;touch-action:pan-y;scrollbar-width:none}
#hello{margin:auto;display:flex;flex-direction:column;align-items:center;gap:2.6vh}.gt{font-size:5.2vh;font-weight:500;text-align:center}
#chips{display:flex;flex-wrap:wrap;gap:1.2vh;justify-content:center;max-width:70vw}#chips button{padding:1.2vh 2.2vh;border-radius:99px;font-size:2vh;background:rgba(255,255,255,.16);border:1px solid var(--gb)}
.msg{max-width:74%;padding:1.3vh 2.2vh;border-radius:24px;font-size:2.2vh;line-height:1.4;user-select:text}
.msg.u{align-self:flex-end;background:var(--a);color:#111;border-bottom-right-radius:8px;white-space:pre-wrap}.msg.m{align-self:flex-start;background:rgba(255,255,255,.2);border-bottom-left-radius:8px}
.msg code{background:rgba(0,0,0,.25);padding:0 .6vh;border-radius:6px}
.dots i{display:inline-block;width:1vh;height:1vh;margin:0 .35vh;border-radius:50%;background:#fff;animation:db 1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes db{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-.6vh)}}
#gi{display:flex;align-items:center;gap:1vh;margin-top:1.2vh;padding:.8vh .8vh .8vh 2.4vh;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid var(--gb)}
#gi input{background:none;border:0;padding:1vh 0;flex:1;border-radius:0}
#gi button{width:5.6vh;height:5.6vh;border-radius:50%;font-size:2.6vh;display:grid;place-items:center}#send{background:var(--a);color:#111;font-weight:700}#mic.rec{background:#ff4d4d}
/* spotify */
#sbg{position:absolute;inset:-12%;background:#1c1c1e center/cover;filter:blur(70px) saturate(1.6) brightness(.55);transition:background-image .8s}
#sl{position:absolute;left:5vw;top:0;bottom:0;width:40vw;display:flex;flex-direction:column;justify-content:center;gap:1.6vh}
.vw{position:relative;width:min(44vh,36vw);aspect-ratio:1;margin:0 auto 1vh}
.vinyl{width:100%;height:100%;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,#0c0c0c 0 2px,#1c1c1c 3px 4px);box-shadow:0 3vh 7vh rgba(0,0,0,.55),0 0 0 .3vh #000;animation:spin 6s linear infinite;animation-play-state:paused}
.vinyl.on{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}
.vinyl .lb{position:absolute;inset:32%;border-radius:50%;background:linear-gradient(135deg,#c44,#fa6) center/cover;box-shadow:0 0 0 .5vh rgba(0,0,0,.6)}
.vinyl .hole{position:absolute;inset:48.2%;border-radius:50%;background:#0b0b0b;box-shadow:inset 0 0 .4vh #000}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0,rgba(255,255,255,.2) 9%,transparent 22%,transparent 50%,rgba(255,255,255,.2) 59%,transparent 72%)}
#ti{font-size:3.6vh;font-weight:700;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ar{font-size:2.6vh;opacity:.75;text-align:center;min-height:3vh}
#pb{display:flex;align-items:center;gap:1.4vh;font-size:1.8vh;opacity:.9;margin:.6vh 2vw}.bar{flex:1;height:.8vh;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px}
#ct{display:flex;justify-content:center;gap:5vh;align-items:center}#ct button{width:8vh;height:8vh;display:grid;place-items:center}#ct svg.i{width:5vh;height:5vh}#spp svg.i{width:6.4vh;height:6.4vh}
#sr2{position:absolute;right:3vw;top:0;bottom:0;width:46vw;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
#lyr{position:absolute;left:0;right:0;top:0;transition:transform .8s cubic-bezier(.22,1,.36,1)}
.ln{font-size:5vh;font-weight:700;line-height:1.14;padding:1.3vh 0;opacity:.28;transform:scale(.93);transform-origin:left center;transition:opacity .5s,transform .6s,filter .5s;text-shadow:0 2px 12px rgba(0,0,0,.3)}.ln.n{opacity:.5}.ln.a{opacity:1;transform:scale(1)}
#scn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:4vh 5vw;display:none;flex-direction:column;align-items:center;gap:2vh;text-align:center;font-size:2.4vh;z-index:3}
/* meteo dettaglio */
#det{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(0,0,0,0);transition:background .45s}#det.show{display:grid}#det.bk{background:rgba(0,0,0,.45)}
#dp,.gc{position:relative;width:min(900px,94vw);height:90vh;overflow:auto;border-radius:36px;padding:4vh 3.4vw 3vh;border:1px solid rgba(255,255,255,.25);box-shadow:0 30px 80px rgba(0,0,0,.5);touch-action:pan-y;scrollbar-width:none}
#dp::-webkit-scrollbar,.gc::-webkit-scrollbar{display:none}
#dp .x,.gc .x{position:absolute;top:2vh;right:2.4vh;font-size:2.4vh;width:4.6vh;height:4.6vh;border-radius:50%;background:rgba(255,255,255,.22)}
.hero{text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.18)}.hero h2{font-size:4vh;font-weight:500;margin:0;text-transform:none}.bt{font-size:15vh;font-weight:200;line-height:1.05;padding-left:2.4vh}.hero div{font-size:2.5vh}
.cd{background:rgba(255,255,255,.16);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.22);border-radius:24px;padding:2vh 2.2vh;margin-top:1.6vh}
.cd h4{font-size:1.6vh;font-weight:600;opacity:.7;letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.2vh}
.hrs{display:flex;gap:.6vh;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}.hrs>div{flex:0 0 9vh;text-align:center;display:flex;flex-direction:column;gap:.7vh;font-size:2.3vh}.hrs small{font-size:1.7vh;opacity:.8}.hrs span{font-size:3vh}
.dr{display:grid;grid-template-columns:13vh 6vh 5vh 1fr 5vh;align-items:center;padding:1.1vh 0;border-top:1px solid rgba(255,255,255,.2);font-size:2.3vh}.dr:first-of-type{border:0}
.dr span:first-child{text-transform:capitalize;font-weight:500}.dr small{opacity:.8;font-size:1.5vh;display:block}.dr span:nth-child(3){opacity:.65;text-align:right}.dr span:last-child{text-align:right}
.tr{height:.8vh;border-radius:9px;background:rgba(255,255,255,.25);position:relative;margin:0 1.6vh}.tr i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#6fd3ff,#ffd86b,#ff9a4d)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vh;margin-top:1.6vh}.tl .cd{margin:0}.tl .v{font-size:4.4vh;font-weight:400;margin-bottom:.6vh}.tl small{font-size:1.8vh;opacity:.85;display:block;line-height:1.3}
#gn{position:fixed;inset:0;z-index:55;pointer-events:none}.gs{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;will-change:transform}
#gn .cd{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.2)}
/* impostazioni */
#set{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;place-items:center}#set.show{display:grid}
#set .glass{width:min(640px,92vw);max-height:90vh;overflow:auto;padding:3vh;display:grid;gap:1.2vh;background:rgba(40,40,50,.6);touch-action:pan-y}
label{font-size:1.8vh;opacity:.8}.sw{display:flex;gap:1.4vh}.sw button{width:5vh;height:5vh;border-radius:50%;border:2px solid #fff6}
#toast{position:fixed;left:50%;bottom:6vh;transform:translate(-50%,3vh);z-index:70;padding:1.4vh 2.6vh;border-radius:99px;font-size:2vh;background:rgba(30,30,40,.8);backdrop-filter:blur(20px);opacity:0;transition:.4s;pointer-events:none;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
<body>
<div id="bg"><svg class="sc" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice"><g transform="translate(0,120)"><path class="m2" d="M0 520L120 450 220 500 360 400 520 490 700 380 900 480 1100 370 1300 470 1450 420 1600 480V1000H0Z"/><path class="m1" d="M0 620L180 530 330 600 520 480 760 600 980 510 1200 610 1400 540 1600 610V1000H0Z"/></g><path class="d1" transform="translate(0,60)" d="M0 760Q400 680 800 740T1600 720V1000H0Z"/><path class="d2" transform="translate(0,60)" d="M0 880Q500 800 1000 860T1600 830V1000H0Z"/></svg></div>

<section class="page" id="p0"><div id="home">
<div class="tile" id="tw"><div class="wt"><span id="wic">⛅</span><span id="wco">Meteo</span></div><div id="wnum">--°</div><div class="lab"><b id="wci">Caricamento…</b><span id="wmm"></span></div></div>
<div class="tile" id="tc"><svg id="ck" viewBox="-50 -50 100 100"></svg></div>
<div class="tile" id="td"><span id="dwk"></span><b id="dnum"></b><span id="dmo"></span></div>
<div class="tile" id="te"><h4>Prossimi eventi</h4><div id="evl"></div></div>
<div class="tile" id="ts"><div class="mv"><div class="vinyl" id="vn2"><div class="lb" id="lb2"></div><div class="hole"></div></div></div><div class="mi"><b id="st1">Spotify</b><span id="st2">Tocca per collegare</span></div><button class="rc" id="sp2"></button></div>
<div class="tile" id="ta"><span class="ic gg">✦</span><div class="lab"><b>Assistente</b><span>Chiedi qualsiasi cosa</span></div></div>
<div class="tile" id="tn"><span class="ic">🔔<i id="nb"></i></span><div class="lab"><b>Notifiche</b><span id="nct">Nessuna</span></div></div>
</div></section>

<section class="page" id="p1"><div class="pad">
<div class="glass" style="flex:1.3"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6vh"><h2 id="mt" style="margin:0"></h2><div class="nav"><button id="pv">‹</button><button id="nx">›</button></div></div><div id="grid"></div></div>
<div class="glass" style="flex:1;display:flex;flex-direction:column"><h2 id="dt"></h2><div id="evs" style="flex:1;overflow:auto"></div>
<div style="display:grid;grid-template-columns:1fr 14vh;gap:1vh;margin-top:1vh"><input id="et" placeholder="Nuovo evento"><input id="eh" type="time"></div><button class="btn" id="ea" style="margin-top:1vh">Aggiungi</button></div></div></section>

<section class="page" id="p2"><div class="pad"><div class="glass" style="flex:1"><div style="display:flex;justify-content:space-between"><h2>Notifiche</h2><button class="btn" id="nc">Pulisci</button></div><div id="nl"></div></div></div></section>

<section class="page" id="p3"><div class="pad"><div class="glass" id="ga">
<div id="gh"><span><span class="gg">✦</span> <span class="gg">Assistente</span></span><button id="nw">Nuova chat</button></div>
<div id="chat"><div id="hello"><div class="gt gg">Ciao, come posso aiutarti?</div><div id="chips"></div></div></div>
<div id="gi"><input id="q" placeholder="Scrivi un messaggio" autocomplete="off"><button id="mic">🎙️</button><button id="send">↑</button></div></div></div></section>

<section class="page" id="p4"><div id="sbg"></div>
<div id="sl"><div class="vw"><div class="vinyl" id="vn"><div class="lb" id="lb"></div><div class="hole"></div></div><div class="sheen"></div></div>
<div id="ti">Niente in riproduzione</div><div id="ar"></div>
<div id="pb"><span id="t1">0:00</span><div class="bar"><i id="bf"></i></div><span id="t2">0:00</span></div>
<div id="ct"><button id="sprev"></button><button id="spp"></button><button id="snext"></button></div></div>
<div id="sr2"><div id="lyr"></div></div>
<div id="scn" class="glass"><div style="font-size:5vh">🎧</div><div>Collega Spotify per vedere il disco<br>e i testi dei brani</div><button class="btn" id="slg">Collega Spotify</button></div></section>

<nav id="dock"><i></i></nav>
<div id="det"><div id="dp"><button class="x">✕</button><div id="detc"></div></div></div>
<div id="set"><div class="glass">
<h2>Impostazioni</h2>
<label>Groq · chiave API (resta solo su questo dispositivo)</label><input id="sk" type="password" placeholder="gsk_…">
<label>Groq · modello</label><input id="sm" placeholder="llama-3.3-70b-versatile">
<button class="btn alt" id="st">Testa Groq</button><div id="sr" style="font-size:1.9vh;min-height:2.4vh"></div>
<label>Spotify · Client ID</label><input id="spid" placeholder="Client ID dalla dashboard Spotify">
<label>Redirect URI da registrare identico su Spotify</label><input id="rur" readonly>
<button class="btn alt" id="spl">Salva e collega Spotify</button>
<label>Posizione meteo (vuoto = automatica via GPS)</label><input id="sc" placeholder="Automatica · oppure scrivi una città">
<label>Sfondo</label><select id="sb"><option value="auto">Automatico (giorno/notte)</option><option value="day">Deserto giorno</option><option value="night">Deserto notte</option><option value="custom">Immagine personale…</option></select>
<input type="file" id="sf" accept="image/*" style="display:none">
<label>Colore d'accento</label><div class="sw" id="sw"></div>
<button class="btn" id="ss">Salva e chiudi</button></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Memoria piena')}};
const S=Object.assign({gk:'',gm:'llama-3.3-70b-versatile',sp:'',city:'',bg:'auto',acc:'#8ab4ff'},L('S',{}));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const d=$('#toast');d.textContent=t;d.classList.add('on');clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('on'),3800)};
let E=L('ev',{}),cur=new Date(),sel=iso(new Date()),WX=L('wx',null),NC=L('nc',[]),SP=L('spt',{}),NP=null,LY=null,li=-2;
const I={play:'<svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg class="i" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',prev:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg>',next:'<svg class="i" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>'};
$('#sprev').innerHTML=I.prev;$('#snext').innerHTML=I.next;$('#spp').innerHTML=I.play;$('#sp2').innerHTML=I.play;
/* ---------- tema ---------- */

 if(LY&&LY.length)LY.forEach(x=>{const d=document.createElement('div');d.className='ln';d.textContent=x.s;b.append(d)});
 else{const d=document.createElement('div');d.className='ln n';d.textContent=NP?(LY?'Testo non disponibile':'…'):'';b.append(d)}}
async function loadLyrics(){const n=NP;LY=null;renderLy();try{const art=n.artist.split(',')[0],ti=n.title.replace(/\s*[\(\[\-].*$/,'');let j=null;
 let r=await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(art)}&track_name=${encodeURIComponent(n.title)}&album_name=${encodeURIComponent(n.album)}&duration=${Math.round(n.dur/1000)}`);if(r.ok)j=await r.json();
 if(!j||!(j.syncedLyrics||j.plainLyrics)){r=await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(art+' '+ti)}`);const a=await r.json();j=a.find(x=>x.syncedLyrics)||a.find(x=>x.plainLyrics)}
 if(!NP||NP.id!==n.id)return;
 if(j?.syncedLyrics)LY=parseLrc(j.syncedLyrics);else if(j?.plainLyrics){const ls=j.plainLyrics.split('\n').filter(x=>x.trim());LY=ls.map((s,i)=>({t:i*n.dur/ls.length,s}))}else LY=[]}catch{LY=[]}renderLy()}
function lyTick(c){if(!LY||!LY.length)return;let k=-1;for(let i=0;i<LY.length;i++){if(LY[i].t<=c+250)k=i;else break}if(k===li)return;li=k;
 const ls=$('#lyr').children;[...ls].forEach((e,i)=>{const d=Math.abs(i-k);e.className='ln'+(i===k?' a':d===1?' n':'');e.style.filter=i===k?'none':`blur(${Math.min(d,4)*.7}px)`});
 const a=ls[Math.max(k,0)];if(a)$('#lyr').style.transform=`translateY(${$('#sr2').clientHeight/2-(a.offsetTop+a.offsetHeight/2)}px)`}
